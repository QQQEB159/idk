name: iOS Build
on:
  push:
    branches: ['main']
  workflow_dispatch:
jobs:
  build:
    name: iOS Build
    permissions: write-all
    runs-on: macos-15
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setting up Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: 4.3.7
      - name: Restore existing build cache for faster compilation
        uses: actions/cache@v4.2.3
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          # key includes a hash of the dependency list so changing libs busts stale caches
          key: cache-build-ios-${{ hashFiles('building/libs.xml') }}
          path: |
            .haxelib/
            export/release/ios/CodenameEngine/haxe/
          restore-keys: |
            cache-build-ios-
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s --no-vscheck
      - name: Building the game
        run: haxelib run lime build ios -nosign
      - name: Clearing already existing cache
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith("cache-build-ios")) {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Making ipa file
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/CodenameEngine.app
          ldid -S../../../CodenameEngine/CodenameEngine.entitlements CodenameEngine
          cd ..
          mkdir Payload
          mv CodenameEngine.app Payload
          zip -r CodenameEngine.ipa Payload
      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine IOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
      - name: Uploading new cache
        if: success()
        uses: actions/cache@v4.2.3
        with:
          # caching again since for some reason it doesnt work with the first post cache shit
          key: cache-build-ios-${{ hashFiles('building/libs.xml') }}
          path: |
            .haxelib/
            export/release/ios/CodenameEngine/haxe
          restore-keys: |
            cache-build-ios-
